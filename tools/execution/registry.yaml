        idempotency: "no"
        approval_required: true
        snapshot_required: true
        recovery_required: true
        timeout_seconds: 600
        description: local-maintenance:clean_orphans
      - id: clean_temp
        effect: mutate-host
        dry_run: "yes"
        idempotency: "no"
        approval_required: true
        snapshot_required: true
        recovery_required: true
        timeout_seconds: 600
        description: local-maintenance:clean_temp
      - id: clean_needrestart
        effect: mutate-host
        dry_run: "yes"
        idempotency: "no"
        approval_required: true
        snapshot_required: true
        recovery_required: true
        timeout_seconds: 600
        description: local-maintenance:clean_needrestart
      - id: update_firmware
        effect: mutate-host
        dry_run: "yes"
        idempotency: "no"
        approval_required: true
        snapshot_required: true
        recovery_required: true
        timeout_seconds: 900
        description: local-maintenance:update_firmware
      - id: clean_userspace_caches
        effect: mutate-host
        dry_run: "yes"
        idempotency: "no"
        approval_required: true
        snapshot_required: true
        recovery_required: true
        timeout_seconds: 600
        description: local-maintenance:clean_userspace_caches
      - id: restore_snapshot
        effect: mutate-host
        dry_run: "yes"
        idempotency: "no"
        approval_required: true
        snapshot_required: true
        recovery_required: true
        timeout_seconds: 600
        description: local-maintenance:restore_snapshot
    automation_limits:
      Agent judgment remains for non-script operations; blocked mutators
      stay blocked without approval.
