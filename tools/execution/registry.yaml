      - id: integrate
        effect: write-workspace
        dry_run: "yes"
        idempotency: "no"
        approval_required: false
        recovery_required: false
        completion_phases: [INTEGRATE]
        required_verifications: [integrate_result]
        description: plan-continue:integrate
      - id: status
        effect: read
        dry_run: "yes"
        idempotency: "yes"
        approval_required: false
        recovery_required: false
        completion_phases: [STATUS]
        required_verifications: [status_result]
