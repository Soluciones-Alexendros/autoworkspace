schema_version: 1
dialect: autoworkspace.execution
skill: project-libraries
skill_version: 7.0.0-alpha.0
execution_kind: agent
distribution: standalone
shared_dependencies: []
system_requirements:
  binaries: []
  network: true
operations:
  - id: sca_scan
    effect: read
    dry_run: "yes"
    idempotency: "yes"
    approval_required: false
    recovery_required: false
    description: project-libraries:sca_scan
  - id: sbom
    effect: write-workspace
    dry_run: "yes"
    idempotency: "no"
    approval_required: false
    recovery_required: false
    description: project-libraries:sbom
handoffs: []
automation_limits:
  Agent judgment remains for non-script operations; blocked mutators
  stay blocked without approval.
