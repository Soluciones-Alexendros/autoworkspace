schema_version: 1
dialect: autoworkspace.execution
skill: web-performance
skill_version: 7.0.0-alpha.0
execution_kind: agent
distribution: standalone
shared_dependencies: []
system_requirements:
  binaries: []
  network: true
operations:
  - id: measure
    effect: read
    dry_run: "yes"
    idempotency: "no"
