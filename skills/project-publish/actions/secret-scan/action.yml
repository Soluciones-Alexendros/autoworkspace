name: secret-scan
description: "Escaneo de secretos con gitleaks 8.30.1 (binario fijado por SHA-256; sin subir SARIF con posible material sensible)"
runs:
  using: composite
  steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Instalar gitleaks 8.30.1 y escanear el historial
      shell: bash
      env:
        GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      run: |
        set -euo pipefail
        archive="gitleaks_8.30.1_linux_x64.tar.gz"
        curl -fsSL -o "$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}"
        echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
        tar -xzf "$archive" gitleaks
        ./gitleaks detect --source . --redact --verbose
