name: setup-node
description: "Setup Node.js pineado con caché npm (composite del canon repo-standard)"
inputs:
  node-version-file:
    description: "Fichero con la versión de Node"
    required: false
    default: ".nvmrc"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: npm
