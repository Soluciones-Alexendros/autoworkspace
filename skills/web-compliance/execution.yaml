schema_version: 1
dialect: autoworkspace.execution
skill: web-compliance
skill_version: 4.1.2
execution_kind: script
distribution: standalone
shared_dependencies: []
system_requirements:
  binaries: []
  network: false
operations:
  - id: auto_checks
    effect: read
    dry_run: "yes"
    idempotency: "yes"
    approval_required: false
    recovery_required: false
    description: web-compliance:auto_checks
  - id: manual_review
    effect: read
    dry_run: unknown
    idempotency: unknown
    approval_required: false
    recovery_required: false
    description: web-compliance:manual_review
handoffs:
  - skill: web-owasp
    when: security findings dominate
  - skill: web-performance
    when: performance findings dominate
automation_limits:
  Automatic checks never certify full GDPR/accessibility; manual
  items remain unevaluated.
