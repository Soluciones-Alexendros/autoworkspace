schema_version: 1
dialect: autoworkspace.execution
skill: plan-continue
skill_version: 7.0.0-alpha.0
execution_kind: orchestrator
distribution: workspace-required
shared_dependencies:
  - tools/workspace-router
  - tools/contracts
system_requirements:
  binaries: []
  network: false
operations:
  - id: route
    effect: read
    dry_run: "yes"
    idempotency: "yes"
    approval_required: false
    recovery_required: false
    description: plan-continue:route
  - id: init
    effect: write-workspace
    dry_run: "yes"
    idempotency: "no"
    approval_required: false
    recovery_required: false
    description: plan-continue:init
  - id: status
    effect: read
    dry_run: "yes"
    idempotency: "yes"
    approval_required: false
    recovery_required: false
    description: plan-continue:status
handoffs: []
automation_limits:
  Agent judgment remains for non-script operations; blocked mutators
  stay blocked without approval.
