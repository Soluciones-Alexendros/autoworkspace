schema_version: 1
dialect: autoworkspace.execution
skill: plan-validators
skill_version: 7.0.0-alpha.0
execution_kind: agent
distribution: standalone
shared_dependencies: []
system_requirements:
  binaries: []
  network: false
operations:
  - id: discover_stack
    effect: read
    dry_run: "yes"
    idempotency: "yes"
    approval_required: false
    recovery_required: false
    description: plan-validators:discover_stack
  - id: red_green
    effect: write-workspace
    dry_run: "yes"
    idempotency: "no"
    approval_required: false
    recovery_required: false
    description: plan-validators:red_green
handoffs: []
automation_limits:
  Agent judgment remains for non-script operations; blocked mutators
  stay blocked without approval.
