schema_version: 1
dialect: autoworkspace.execution
skill: local-security
skill_version: 5.1.1
execution_kind: script
distribution: standalone
shared_dependencies: []
system_requirements:
  binaries: []
  network: false
operations:
  - id: posture_audit
    effect: read
    dry_run: "yes"
    idempotency: "yes"
    approval_required: false
    recovery_required: false
    description: local-security:posture_audit
  - id: harden_plan
    effect: read
    dry_run: "yes"
    idempotency: "yes"
    approval_required: false
    recovery_required: false
    description: local-security:harden_plan
  - id: apply_hardening
    effect: mutate-host
    dry_run: "yes"
    idempotency: "no"
    approval_required: true
    recovery_required: true
    description: local-security:apply_hardening
handoffs: []
automation_limits:
  Agent judgment remains for non-script operations; blocked mutators
  stay blocked without approval.
