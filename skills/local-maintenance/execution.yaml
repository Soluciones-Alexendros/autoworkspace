schema_version: 1
dialect: autoworkspace.execution
skill: local-maintenance
skill_version: 5.1.6
execution_kind: script
distribution: standalone
shared_dependencies:
  - tools/execution
system_requirements:
  binaries: []
  network: false
operations:
  - id: health_check
    effect: read
    dry_run: "yes"
    idempotency: "yes"
    approval_required: false
    recovery_required: false
    description: local-maintenance:health_check
  - id: clean_routine
    effect: mutate-host
    dry_run: "yes"
    idempotency: "no"
    approval_required: true
    recovery_required: true
    description: local-maintenance:clean_routine
  - id: create_snapshot
    effect: write-workspace
    dry_run: "yes"
    idempotency: "no"
    approval_required: true
    recovery_required: false
    description: local-maintenance:create_snapshot
  - id: restore_snapshot
    effect: mutate-host
    dry_run: "yes"
    idempotency: "no"
    approval_required: true
    recovery_required: true
    description: local-maintenance:restore_snapshot
handoffs: []
automation_limits:
  Agent judgment remains for non-script operations; blocked mutators
  stay blocked without approval.
