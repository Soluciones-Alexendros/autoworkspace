schema_version: 1
dialect: autoworkspace.execution
skill: plan-specification
skill_version: 7.0.0-alpha.0
execution_kind: orchestrator
distribution: standalone
shared_dependencies: []
system_requirements:
  binaries: []
  network: false
operations:
  - id: specify
    effect: write-workspace
    dry_run: "yes"
    idempotency: "no"
    approval_required: false
    recovery_required: false
    description: plan-specification:specify
  - id: plan
    effect: write-workspace
    dry_run: "yes"
    idempotency: "no"
    approval_required: false
    recovery_required: false
    description: plan-specification:plan
  - id: tasks
    effect: write-workspace
    dry_run: "yes"
    idempotency: "no"
    approval_required: false
    recovery_required: false
    description: plan-specification:tasks
handoffs: []
automation_limits:
  Agent judgment remains for non-script operations; blocked mutators
  stay blocked without approval.
