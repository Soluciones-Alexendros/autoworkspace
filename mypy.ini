[mypy]
python_version = 3.12
strict = true
explicit_package_bases = true
mypy_path = tools
exclude = (?x)(
    ^tools/workspace-router/
    | ^tools/skill-router/
    | ^tools/skill-index/
    | .*/tests/conftest\.py$
    | ^\.worktrees/
    | ^\.venv/
  )

[mypy-yaml]
ignore_missing_imports = true

[mypy-jsonschema]
ignore_missing_imports = true

[mypy-status_bump]
ignore_missing_imports = true
