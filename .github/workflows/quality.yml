name: quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --project tools
      - name: Hygiene
        run: uv run --project tools python3 tools/validate/hygiene.py
      - name: Announce private check not applicable on PR
        if: github.event_name == 'pull_request'
        run: echo "PRIVATE_CHECK_NOT_APPLICABLE_TO_PR"
      - name: Private denylist (required on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
          AUTOWORKSPACE_PRIVATE_PATTERNS: ${{ secrets.HYGIENE_DENYLIST }}
        run: uv run --project tools python3 tools/validate/private_denylist.py
      - name: bash -n global
        run: |
          find skills tools -name '*.sh' -print0 | xargs -0 -n1 bash -n
