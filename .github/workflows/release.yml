name: release
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tagged: ${{ steps.cut.outputs.tagged }}
      version: ${{ steps.cut.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Validate
        run: |
          python3 tools/validate/skill_spec.py
          python3 tools/validate/skill_links.py
          python3 tools/validate/release_coherence.py
      - name: Publish from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python3 tools/validate/release_coherence.py --release-gate
          python3 tools/version/cut_tag.py --extract-notes "$VERSION" --notes-file notes.md
          gh release create "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
      - name: Cut annotated tag on main
        id: cut
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/version/cut_tag.py --apply --notes-file notes.md
      - name: Push tag and create GitHub Release
        if: github.ref == 'refs/heads/main' && steps.cut.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.cut.outputs.version }}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --notes-file notes.md --verify-tag

  provenance:
    name: Attest source archive
    needs: publish
    if: ${{ (github.ref == 'refs/heads/main' && needs.publish.outputs.tagged == 'true') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive source
        run: |
          set -euo pipefail
          VERSION="${{ needs.publish.outputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          git archive --format=tar.gz --prefix="autoworkspace-${VERSION}/" -o "autoworkspace-${VERSION}.tar.gz" HEAD
          echo "ARCHIVE=autoworkspace-${VERSION}.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}
