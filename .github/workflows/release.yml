name: release
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tagged: ${{ steps.cut.outputs.tagged }}
      version: ${{ steps.cut.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen --project tools
      - name: Validate
        run: |
          uv run --project tools python3 tools/validate/skill_spec.py
          uv run --project tools python3 tools/validate/skill_links.py
          uv run --project tools python3 tools/validate/release_coherence.py
      - name: Private denylist required before publish
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
          MACHINEROOM_PRIVATE_PATTERNS: ${{ secrets.HYGIENE_DENYLIST }}
        run: uv run --project tools python3 tools/validate/private_denylist.py
      - name: Publish from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          uv run --project tools python3 tools/validate/release_coherence.py --release-gate
          uv run --project tools python3 tools/version/cut_tag.py --extract-notes "$VERSION" --notes-file notes.md
          gh release create "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
      - name: Cut annotated tag on main
        id: cut
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --project tools python3 tools/version/cut_tag.py --apply --notes-file notes.md
      - name: Push tag and create GitHub Release
        if: github.ref == 'refs/heads/main' && steps.cut.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${VERSION}"
          gh release create "v${VERSION}" --notes-file notes.md --verify-tag

  provenance:
    name: Attest source archive
    needs: publish
    if: ${{ (github.ref == 'refs/heads/main' && needs.publish.outputs.tagged == 'true') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release version
        id: version
        env:
          PUBLISH_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${PUBLISH_VERSION}" ]; then
            VERSION="${PUBLISH_VERSION}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "ERROR: cannot resolve release VERSION from publish output or tag ref (${GITHUB_REF_NAME})" >&2
            exit 1
          fi
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "main" ] || [[ "${VERSION}" == *"/"* ]]; then
            echo "ERROR: invalid release VERSION=${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version v${VERSION}"
      - name: Archive source
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="machineroom-${VERSION}/" -o "machineroom-${VERSION}.tar.gz" HEAD
          echo "ARCHIVE=machineroom-${VERSION}.tar.gz" >> "$GITHUB_ENV"
      - name: Checksum source archive
        run: sha256sum "${ARCHIVE}" > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Upload attested release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${VERSION}"
          test -n "${ARCHIVE}"
          test -f "${ARCHIVE}"
          test -f SHA256SUMS
          gh release view "v${VERSION}" >/dev/null
          gh release upload "v${VERSION}" "${ARCHIVE}" SHA256SUMS
          # Fail closed if assets are still missing after upload.
          mapfile -t ASSETS < <(gh release view "v${VERSION}" --json assets --jq '.assets[].name')
          printf '%s\n' "${ASSETS[@]}" | grep -qx "${ARCHIVE}"
          printf '%s\n' "${ASSETS[@]}" | grep -qx SHA256SUMS

  post-release-smoke:
    name: Post-release public smoke
    needs: [publish, provenance]
    if: ${{ always() && needs.provenance.result == 'success' && ((github.ref == 'refs/heads/main' && needs.publish.outputs.tagged == 'true') || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Resolve version
        id: version
        env:
          PUBLISH_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${PUBLISH_VERSION}" ]; then
            VERSION="${PUBLISH_VERSION}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "ERROR: cannot resolve release VERSION from publish output or tag ref (${GITHUB_REF_NAME})" >&2
            exit 1
          fi
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "main" ] || [[ "${VERSION}" == *"/"* ]]; then
            echo "ERROR: invalid release VERSION=${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          gh release download "v${VERSION}" --dir "$TMP" --pattern "machineroom-${VERSION}.tar.gz" --pattern SHA256SUMS
          (
            cd "$TMP"
            sha256sum -c SHA256SUMS
          )
          gh attestation verify "$TMP/machineroom-${VERSION}.tar.gz" --repo "${GITHUB_REPOSITORY}"
          echo "Public assets + checksum + attestation OK for v${VERSION}"
      - name: Bootstrap smoke (Pi + Cursor, no models)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          bash scripts/bootstrap.sh --version "${VERSION}" --harness pi --target "$TMP/pi" --json
          bash scripts/bootstrap.sh --version "${VERSION}" --harness cursor --target "$TMP/cursor" --json
