name: version
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Exigir bump de metadata.version en skills cambiadas
        run: uv run python3 tools/version/bump.py --check --auto --base origin/${{ github.event.pull_request.base.ref || 'main' }}
      - name: Exigir package.json por delante del tag si cambia el circuito de release
        run: uv run python3 tools/version/cut_tag.py --check-repo --base origin/${{ github.event.pull_request.base.ref || 'main' }}
