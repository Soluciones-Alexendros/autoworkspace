name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline-python:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-python.yml
    with:
      python-version: "3.12"
      coverage-threshold: "77"
      run-build: false

  pipeline-node:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-node.yml
    with:
      node-version: "22"
      package-manager: npm
      run-build: false
      run-test: false
      run-smoke: false
      e2e: false

  canon:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-static.yml
    with:
      quality-command: |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        (
          cd "$tmpdir"
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash | bash
        )
        "$tmpdir/actionlint" -color
        bash scripts/check-structure.sh templates/repo
      test-command: make -f templates/repo/Makefile test
      smoke-command: bash scripts/smoke.sh

  # Verifica el direccionamiento que usarán los callers (ruta completa + SHA).
  # SHA se actualiza al tip de esta rama tras el push de T5.
  caller-reusable-path:
    permissions:
      contents: read
      pull-requests: read
    uses: Soluciones-Alexendros/autoworkspace/.github/workflows/reusable-static.yml@c6674366d2e4e7bfa8a2ba0a5cdaea06ff795ee4
    with:
      quality-command: "echo caller-path-ok"
      test-command: "echo caller-path-ok"
      smoke-command: "echo caller-path-ok"

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Hygiene
        run: uv run python3 tools/validate/hygiene.py
      - name: Private patterns denylist (HYGIENE_DENYLIST)
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
          AUTOWORKSPACE_PRIVATE_PATTERNS: ${{ secrets.HYGIENE_DENYLIST }}
        run: |
          set -euo pipefail
          if [ -z "${HYGIENE_DENYLIST:-}" ]; then
            echo "::warning::HYGIENE_DENYLIST secret absent — step not_run (never false green). Task for Alejandro."
            echo "not_run: HYGIENE_DENYLIST secret not configured"
            exit 0
          fi
          echo "$HYGIENE_DENYLIST" | while IFS= read -r pat; do
            [ -z "$pat" ] && continue
            if git grep -nEe "$pat" -- . ':(exclude).git' >/dev/null 2>&1; then
              echo "::error::denylist pattern matched in tree: $pat"
              git grep -nEe "$pat" -- . ':(exclude).git' || true
              exit 1
            fi
          done
          echo "denylist OK"
      - name: bash -n global
        run: |
          find skills tools -name '*.sh' -print0 | xargs -0 -n1 bash -n

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run bash run-validation.sh

  check-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Exigir bump de metadata.version en skills cambiadas
        run: uv run python3 tools/version/bump.py --check --auto --base origin/${{ github.event.pull_request.base.ref || 'main' }}
      - name: Exigir package.json por delante del tag si cambia el circuito de release
        run: uv run python3 tools/version/cut_tag.py --check-repo --base origin/${{ github.event.pull_request.base.ref || 'main' }}

  ci-gate:
    name: ci-gate
    needs:
      [
        pipeline-python,
        pipeline-node,
        canon,
        caller-reusable-path,
        hygiene,
        validate,
        check-bump,
      ]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluar needs y hold
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # check-bump only runs on pull_request; allow skip on push to main
          ALLOWED_SKIPS: ${{ github.event_name != 'pull_request' && 'check-bump' || '' }}
          HOLD: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'hold') }}
        run: |
          set -euo pipefail
          if [[ "${HOLD}" == "true" ]]; then
            echo "::error::PR con etiqueta hold: ci-gate falla a propósito (quita hold para auto-merge)."
            exit 1
          fi
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi
          echo "$NEEDS_JSON" | jq -e --argjson skips "$(printf '%s\n' "${ALLOWED_SKIPS}" | jq -R 'split(" ") | map(select(length>0))')" '
            to_entries
            | map(select(.value.result != "success" and ((.key as $k | $skips | index($k)) | not)))
            | if length == 0 then true else
                error("ci-gate: jobs no success: " + (map(.key + "=" + .value.result) | join(", ")))
              end
          ' >/dev/null
