name: Security

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
      - name: Lint workflows
        uses: ./skills/project-publish/actions/actionlint
