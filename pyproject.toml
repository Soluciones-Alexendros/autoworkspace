[project]
name = "autoworkspace"
version = "6.0.0"
description = "Autoworkspace — agentic pipeline and fleet canon host"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pyyaml>=6.0",
  "pytest==9.0.3",
  "ruff>=0.8",
  "jsonschema==4.26.0",
  "mypy==2.4.0",
  "pytest-cov==7.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

# BEGIN GENERATED: quality-debt (tools/validate/freeze_quality_debt.py — do not edit by hand)
# Generated baseline — retire in P12. Do not edit by hand.
# ruff remaining by rule: PLR2004=135, PLC0415=49, C901=32, PLW0603=26, PLR0912=23, E501=21, PLW1510=20, RUF059=13, PLR0911=12, PLR0913=12, PLR0915=12, PLW0108=10, UP017=10, E741=9, RUF003=9, SIM117=9, RUF043=6, SIM115=6, E402=5, PLR0917=4, PLW2901=4, RUF002=4, SIM105=4, SIM108=4, UP022=4, SIM103=3, F841=2, PLW0602=2, RUF001=2, SIM102=2, B007=1, N806=1, N999=1, RUF005=1
# mypy remaining by code: no-untyped-def=535, no-untyped-call=368, type-arg=75, import-not-found=26, attr-defined=21, import-untyped=9, var-annotated=8, no-any-return=7, misc=6, assignment=2, func-returns-value=2, arg-type=1, dict-item=1, unused-ignore=1

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "N", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"skills/project-publish/scripts/review-vs-plan.py" = ["PLR2004", "PLW1510"]
"skills/web-compliance/scripts/audit_page.py" = ["C901", "E741", "F841", "PLR0912", "PLR0915", "PLR2004", "RUF059"]
"skills/web-compliance/scripts/contrast.py" = ["PLR2004"]
"skills/web-compliance/scripts/report.py" = ["B007", "C901", "E501", "N806", "PLR0912", "RUF001", "SIM105"]
"skills/web-compliance/scripts/selftest.py" = ["PLR2004", "RUF059"]
"skills/web-compliance/tests/test_cli.py" = ["PLR2004"]
"skills/web-compliance/tests/test_golden_errors.py" = ["PLR0913", "PLR0917", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "tools"
exclude = [
  'tools/workspace-router/',
  'tools/skill-router/',
  '.*/tests/conftest\.py$',
]

[[tool.mypy.overrides]]
module = [
  "audit_page",
  "contrast",
  "report",
  "score",
  "selftest",
  "test_cli",
  "test_golden_errors",
]
ignore_errors = true
# END GENERATED: quality-debt

# Terceros sin stubs publicados: se declaran aquí una sola vez, sin silenciar
# los módulos propios.
[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "status_bump"]
ignore_missing_imports = true
