[project]
name = "autoworkspace"
version = "6.0.0"
description = "Autoworkspace — agentic pipeline and fleet canon host"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pyyaml>=6.0",
  "pytest==9.0.3",
  "ruff>=0.8",
  "jsonschema==4.26.0",
  "mypy==2.4.0",
  "pytest-cov==7.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "N", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "tools"
# Exclusions estructurales, no deuda congelada (retirado el baseline en P12 T6e).
# `tools/workspace-router/` y `tools/skill-router/` son CLIs sin paquete importable
# (el nombre del directorio lleva guion, lo fija el contrato del router) y los
# `conftest.py` duplicados chocan entre si al compartir nombre de modulo.
exclude = [
  'tools/workspace-router/',
  'tools/skill-router/',
  '.*/tests/conftest\.py$',
]

# Terceros sin stubs publicados: se declaran aquí una sola vez, sin silenciar
# los módulos propios.
[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "status_bump"]
ignore_missing_imports = true
